<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To Azizah Zuhrufah IR</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --y1:#FFF3B0; --y2:#FFE066; --y3:#FFC918; --y4:#F2A900;
    --brown:#6B4200; --white:#fffdf2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Baloo 2',system-ui,sans-serif;
    color:var(--brown);
    background:linear-gradient(180deg,var(--y1) 0%,var(--y2) 55%,var(--y3) 100%);
    min-height:100vh; overflow-x:hidden; position:relative;
  }
  /* pola titik lembut */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.45) 2px,transparent 2px);
    background-size:34px 34px;opacity:.6;
  }
  .wrap{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:28px 18px 80px;text-align:center}

  .to{
    display:inline-block;background:var(--white);padding:8px 22px;border-radius:999px;
    font-weight:700;letter-spacing:.5px;box-shadow:0 4px 0 var(--y4);
    font-size:1.05rem;margin-bottom:26px;
  }
  .hero-title{
    font-weight:800;line-height:1.02;text-transform:uppercase;
    font-size:clamp(2.4rem,10vw,4.6rem);
    color:#fff;
    text-shadow:0 4px 0 var(--y4),0 8px 0 rgba(107,66,0,.25);
    -webkit-text-stroke:2px var(--brown);
    paint-order:stroke fill;
    animation:pop 1.1s cubic-bezier(.2,1.6,.4,1) both;
  }
  .hero-title span{display:block}
  .hero-title .big{font-size:1.18em}
  @keyframes pop{0%{transform:scale(.3) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .sub{font-family:'Caveat',cursive;font-size:1.7rem;margin-top:14px;font-weight:700}

  /* bebek */
  .duck-row{display:flex;justify-content:center;gap:26px;margin:22px 0 6px;align-items:flex-end}
  .duck{width:120px;animation:bob 2.2s ease-in-out infinite}
  .duck.small{width:84px;animation-delay:.6s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}

  /* slot stiker buatan sendiri */
  .sticker{width:120px;height:120px;object-fit:contain;display:none;animation:bob 2.4s ease-in-out infinite}

  h2.section{font-weight:800;font-size:1.6rem;margin:44px 0 6px}
  .section-note{font-family:'Caveat',cursive;font-size:1.35rem;margin-bottom:22px}

  /* foto */
  .photos{display:flex;flex-wrap:wrap;gap:26px;justify-content:center}
  .polaroid{
    background:#fff;padding:12px 12px 16px;border-radius:6px;width:min(320px,86vw);
    box-shadow:0 10px 24px rgba(107,66,0,.28);
    transition:transform .35s;
  }
  .polaroid:nth-child(1){transform:rotate(-3deg)}
  .polaroid:nth-child(2){transform:rotate(3deg)}
  .polaroid:hover{transform:rotate(0) scale(1.03)}
  .polaroid .img{
    width:100%;aspect-ratio:3/4;border-radius:3px;overflow:hidden;background:var(--y1);
    display:flex;align-items:center;justify-content:center;
  }
  .polaroid img{width:100%;height:100%;object-fit:cover;display:block}
  .polaroid .cap{font-family:'Caveat',cursive;font-size:1.45rem;margin-top:10px;font-weight:700}
  .missing{padding:20px;font-size:.95rem;color:var(--brown)}

  /* tombol */
  .btn{
    margin-top:48px;border:none;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:1.5rem;
    padding:16px 46px;border-radius:999px;color:#fff;
    background:linear-gradient(180deg,#ffb300,#f28c00);
    box-shadow:0 6px 0 #b86500,0 14px 26px rgba(107,66,0,.35);
    text-shadow:0 2px 0 rgba(0,0,0,.2);
    transition:transform .15s,box-shadow .15s;
    animation:pulse 1.8s ease-in-out infinite;
  }
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b86500}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .hint{font-family:'Caveat',cursive;font-size:1.3rem;margin-top:12px}

  /* modal surat */
  .overlay{
    position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(107,66,0,.55);backdrop-filter:blur(3px);padding:16px;
  }
  .overlay.show{display:flex}
  .letter{
    position:relative;width:min(560px,100%);max-height:88vh;overflow-y:auto;
    background:repeating-linear-gradient(180deg,#fffbe0 0,#fffbe0 33px,#ffe98a 34px);
    border-radius:16px;padding:30px 26px 26px;text-align:left;
    box-shadow:0 20px 50px rgba(0,0,0,.4);border:4px solid var(--y3);
    animation:rise .6s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes rise{from{transform:translateY(60px) scale(.85);opacity:0}to{transform:none;opacity:1}}
  .letter h3{font-family:'Caveat',cursive;font-size:2.1rem;margin-bottom:10px}
  #typed{font-size:1.12rem;line-height:34px;white-space:pre-wrap;min-height:200px}
  .cursor{display:inline-block;width:2px;height:1.1em;background:var(--brown);vertical-align:text-bottom;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .close{
    position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;
    border:none;background:var(--y3);color:var(--brown);font-size:1.2rem;font-weight:800;cursor:pointer;
  }
  .controls{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .controls button{
    font-family:inherit;font-weight:700;border:2px solid var(--brown);background:var(--white);
    color:var(--brown);padding:6px 16px;border-radius:999px;cursor:pointer;font-size:.95rem;
  }

  /* balon & konfeti */
  .fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .balloon{
    position:absolute;bottom:-120px;width:44px;height:56px;border-radius:50% 50% 48% 48%;
    opacity:.85;animation:float linear infinite;
  }
  .balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:46px;background:rgba(107,66,0,.4)}
  @keyframes float{to{transform:translateY(-120vh) translateX(30px)}}
  .confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  footer{margin-top:60px;font-family:'Caveat',cursive;font-size:1.4rem}
</style>
</head>

<script>
/* ====== EDIT BAGIAN INI SESUAI KEINGINANMU ====== */
const PESAN =
`Upeeee HaaBeeeDeee yach🥳🥳
Semoga jadi lebih baik kedepannya, 
main banyak prestasi yg bisa muraih, 
ingat selalu jaga kesehatan upee, 
kalau capek istirahat jangan dipaksa. 

Makin sukses pokokna untuk temanku ini ahahha. 
Mau bilang makasih juga karna selalu ada, selalu Baek sama saya, tiap butuhkan selalu muusahakan, 
tetap jadi upe' yg kukenal Yaahh🤗

Intinya sukses terus kedepannya untuk kamu, 
semoga selalu di pertemukan sama org org Baek, 
semua impiannya dapat terwujud, 
BTW kurang kurangi galaunya nahh ahahah. 💛

Peluk jauh,
NALAA 🐥`;
const KECEPATAN_KETIK = 55; // milidetik per huruf (makin besar makin pelan)
/* ================================================ */

const overlay = document.getElementById('overlay');
const typed = document.getElementById('typed');
const musicBtn = document.getElementById('musicBtn');
let typingTimer = null, runId = 0;

function startTyping(){
  clearTimeout(typingTimer); runId++;
  const my = runId; typed.textContent = ''; let i = 0;
  (function step(){
    if(my !== runId) return;
    if(i < PESAN.length){
      typed.textContent += PESAN[i++];
      const c = PESAN[i-1];
      const delay = KECEPATAN_KETIK + ('.,\n'.includes(c) ? 220 : 0);
      typingTimer = setTimeout(step, delay);
      typed.parentElement.scrollTop = typed.parentElement.scrollHeight;
    }
  })();
}

/* ====== Musik: Happy Birthday (Web Audio, tanpa file) ====== */
let ctx = null, musicOn = false, musicTimer = null;
const N = {G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784};
const MELODY = [
 ['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
 ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
 ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
 ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2.5]
];
const BEAT = 0.52;
function playTone(freq, start, dur){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(0.22, start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, start+dur*0.95);
  o.connect(g).connect(ctx.destination);
  o.start(start); o.stop(start+dur);
}
function playMelodyLoop(){
  if(!musicOn) return;
  let t = ctx.currentTime + 0.1, total = 0;
  MELODY.forEach(([n,b])=>{ playTone(N[n], t+total*BEAT, b*BEAT); total += b; });
  musicTimer = setTimeout(playMelodyLoop, (total*BEAT + 1.2)*1000);
}
function startMusic(){
  if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended') ctx.resume();
  musicOn = true; musicBtn.textContent = '⏸ Jeda musik'; playMelodyLoop();
}
function stopMusic(){
  musicOn = false; clearTimeout(musicTimer);
  if(ctx) ctx.suspend();
  musicBtn.textContent = '▶ Putar musik';
}
musicBtn.onclick = ()=> musicOn ? stopMusic() : startMusic();

/* ====== Buka / tutup ====== */
document.getElementById('openBtn').onclick = ()=>{
  overlay.classList.add('show'); startMusic(); startTyping(); confettiBurst();
};
function closeLetter(){ overlay.classList.remove('show'); runId++; clearTimeout(typingTimer); stopMusic(); }
document.getElementById('closeBtn').onclick = closeLetter;
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeLetter(); });
document.getElementById('replayBtn').onclick = startTyping;

/* ====== Efek ====== */
const colors = ['#FF6FA5','#FFFFFF','#FFB300','#7AD7F0','#9BE564','#FF8F6B'];
function confettiBurst(){
  for(let i=0;i<70;i++){
    const c = document.createElement('div'); c.className='confetti';
    c.style.left = Math.random()*100+'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (2.5+Math.random()*2.5)+'s';
    c.style.animationDelay = (Math.random()*0.6)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),6000);
  }
}
const fx = document.getElementById('fx');
for(let i=0;i<9;i++){
  const b = document.createElement('div'); b.className='balloon';
  b.style.left = (Math.random()*95)+'vw';
  b.style.background = ['#FFFFFF','#FFB300','#FF6FA5','#FFF3B0'][i%4];
  b.style.animationDuration = (12+Math.random()*10)+'s';
  b.style.animationDelay = (-Math.random()*14)+'s';
